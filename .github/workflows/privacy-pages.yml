name: Privacy policy (GitHub Pages)

# Publishes docs/privacy/ (the app's privacy policy, FR + EN) to https://aschefr.github.io/Alanbix/
# The stores need a stable public address that does not depend on any LAN server.
on:
  push:
    branches: [master]
    paths:
      - "docs/privacy/**"
      - ".github/workflows/privacy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/privacy
      - id: deployment
        uses: actions/deploy-pages@v4
